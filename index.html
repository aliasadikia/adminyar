<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ادمین‌یار - دستیار هوش مصنوعی اینستاگرام</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { color: #ddd; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background: #fff;
            color: #764ba2;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #f0f0f0; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>ادمین‌یار (AdminYar)</h1>
        <p>دستیار حرفه‌ای تولید محتوا و مدیریت اینستاگرام</p>
        <a href="1/index.html" class="btn">ورود به اپلیکیشن</a>
    </div>
</body>
</html>
